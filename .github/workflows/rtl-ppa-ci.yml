name: RTL PPA Copilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Generate RTL corpus
        run: python gen_designs.py
      - name: Synthesize corpus and extract graphs
        run: python run_synth.py
      - name: Train and evaluate models
        run: python train_eval.py
      - name: Verify generated artifacts
        run: |
          test -s model.pkl
          test -s results.json
          test -s parity.png
          python - <<'PY'
          import json
          rows = json.load(open("dataset.json"))
          assert len(rows) == 315, len(rows)
          assert all(row.get("ok") for row in rows), "Some Yosys corpus jobs failed"
          print(f"Validated {len(rows)} synthesized designs")
          PY
      - name: Smoke-test prediction and verified drift CLI
        run: |
          python - <<'PY'
          import ast, json, subprocess
          manifest = json.load(open("designs/manifest.json"))
          # Use distinct generated designs to exercise both inference and Yosys verification.
          paths = [f"designs/{row['name']}.v" for row in manifest[:2]]
          pred = subprocess.run(["python", "copilot.py", "predict", paths[0]],
                                check=True, text=True, capture_output=True)
          values = ast.literal_eval(pred.stdout.strip())
          assert set(values) == {"depth", "cells"}, values
          assert all(isinstance(v, (int, float)) and v > 0 for v in values.values()), values
          drift = subprocess.run(["python", "copilot.py", "drift", *paths, "--verify"],
                                 check=True, text=True, capture_output=True)
          assert "actual (Yosys/ABC)" in drift.stdout, drift.stdout
          print("CLI prediction and Yosys/ABC verified drift passed")
          print(drift.stdout)
          PY
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtl-ppa-copilot-reproducibility
          path: |
            model.pkl
            results.json
            parity.png
            dataset.json
            graphs/
            designs/
