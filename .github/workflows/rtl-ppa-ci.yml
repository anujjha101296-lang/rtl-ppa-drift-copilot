name: RTL PPA Copilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Generate RTL corpus
        run: python gen_designs.py
      - name: Synthesize corpus and extract graphs
        run: python run_synth.py
      - name: Train and evaluate models
        run: python train_eval.py
      - name: Verify generated artifacts
        run: |
          test -s model.pkl
          test -s results.json
          test -s parity.png
          python - <<'PY'
          import json
          rows = json.load(open("dataset.json"))
          assert len(rows) == 315, len(rows)
          assert all(row.get("ok") for row in rows), "Some Yosys corpus jobs failed"
          print(f"Validated {len(rows)} synthesized designs")
          PY
      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtl-ppa-copilot-reproducibility
          path: |
            model.pkl
            results.json
            parity.png
            dataset.json
            graphs/
            designs/
